<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMEFINDER β2</title><link rel="stylesheet" href="style.css"></head><body><header><b>GAMEFINDER</b><small>β2 / 300 TITLES</small></header><main><section id="home"><span>DISLIKE → DISCOVER</span><h1>「つまらなかった」から<br><strong>次にハマるゲーム。</strong></h1><p>好きなゲームだけでは分からない「地雷」を、合わなかったゲームから逆算します。</p><button onclick="start()">診断をはじめる →</button></section><section id="quiz" class="hide"><div class="progress"><i id="bar"></i></div><div class="page" id="p1"><small>STEP 1 / 3</small><h2>つまらなかったゲーム</h2><p>最大5本。「なぜか合わなかった」でもOK。</p><input id="badSearch" oninput="renderBad()" placeholder="ゲーム名を検索…"><div id="bad"></div><div id="badSel"></div><button onclick="go(2)">次へ →</button></div><div class="page hide" id="p2"><small>STEP 2 / 3</small><h2>何が嫌だった？</h2><p>複数選択。ここが診断の精度を上げます。</p><div id="reasons" class="chips"></div><button class="secondary" onclick="go(1)">← 戻る</button><button onclick="go(3)">次へ →</button></div><div class="page hide" id="p3"><small>STEP 3 / 3</small><h2>好きだったゲーム</h2><p>最大5本。1本でも診断できます。</p><input id="goodSearch" oninput="renderGood()" placeholder="ゲーム名を検索…"><div id="good"></div><div id="goodSel"></div><button class="secondary" onclick="go(2)">← 戻る</button><button onclick="diagnose()">診断する →</button></div><div id="result" class="hide"></div></section></main><footer>GAMEFINDER β2</footer><script src="games.js"></script><script src="app.js"></script></body></html>
